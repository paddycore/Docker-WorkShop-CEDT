name: CI
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
env:
  IMAGE_NAME: workshop-app
jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        run: docker build -t "$IMAGE_NAME:${{ github.sha }}" .
      - name: Scan image with Trivy
        id: scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true
      - name: Normalize registry credentials
        id: registry
        env:
          REGISTRY_USERNAME_INPUT: ${{ secrets.DOCKERHUB_USERNAME }}
          REGISTRY_TOKEN_INPUT: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          python3 - <<'PYCODE'
          import os, re
          def clean(value):
              value = value.strip()
              if len(value) >= 2 and value[0] == value[-1] and value[0] in "\"'":
                  value = value[1:-1].strip()
              return value
          username = clean(os.environ['REGISTRY_USERNAME_INPUT']).lower()
          token = clean(os.environ['REGISTRY_TOKEN_INPUT'])
          if not re.fullmatch(r'[a-z0-9][a-z0-9_-]*', username):
              raise SystemExit('DOCKERHUB_USERNAME must be your Docker ID, without an email address or URL.')
          if not token or any(c.isspace() for c in token):
              raise SystemExit('DOCKERHUB_TOKEN contains whitespace. Paste only the generated token into the secret.')
          print('::add-mask::' + token)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('username=' + username + '\n')
              output.write('token=' + token + '\n')
          print('Registry credential formatting validated.')
          PYCODE
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ steps.registry.outputs.username }}
          password: ${{ steps.registry.outputs.token }}
      - name: Tag and push
        id: push
        env:
          DOCKERHUB_USERNAME: ${{ steps.registry.outputs.username }}
        run: |
          FULL="$DOCKERHUB_USERNAME/$IMAGE_NAME"
          docker tag "$IMAGE_NAME:${{ github.sha }}" "$FULL:${{ github.sha }}"
          docker tag "$IMAGE_NAME:${{ github.sha }}" "$FULL:latest"
          docker push "$FULL:${{ github.sha }}"
          docker push "$FULL:latest"
